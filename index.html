<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bibliópolis</title>
<meta name="description" content="Bibliópolis: juego de tablero bíblico para jugar en el celular.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{
  color-scheme: dark;
  --lapis:#16366f; --lapis-d:#0d2250; --lapis-l:#2c5aa3;
  --papyrus:#ecdfbb; --papyrus-2:#e2d1a3; --papyrus-3:#d6c08a;
  --ink:#33220f; --ink-soft:#6b5335; --sepia:#8a6a3c;
  --cedar:#4a2c14; --cedar-l:#6e4522; --bronze:#b8893a; --gold:#e3b64a; --gold-l:#f6dc8e;
  --cinnabar:#a8321f; --malachite:#2f7a52; --wax:#8e1f1a;
  --display:"Cinzel Decorative","Cinzel","Trajan Pro",Georgia,serif;
  --head:"Cinzel","Trajan Pro",Georgia,serif;
  --body:"EB Garamond","Garamond","Palatino Linotype",Georgia,serif;
  --papyrus-tex:repeating-linear-gradient(0deg,rgba(110,80,30,.07) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(110,80,30,.06) 0 1px,transparent 1px 5px);
}
*{box-sizing:border-box}
html,body{background:var(--lapis-d)}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:0 48px;
  background-color:var(--lapis);
  background-image:
   radial-gradient(ellipse at 50% -10%,rgba(255,255,255,.12),transparent 60%),
   repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 30px),
   repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 2px,transparent 2px 60px),
   linear-gradient(180deg,var(--lapis),var(--lapis-d));
  background-attachment:fixed}
.wrap{max-width:1120px;margin:0 auto}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold-l);outline-offset:2px}

/* friso de cabecera */
.frieze{height:14px;margin-inline:-16px;background:
  radial-gradient(circle at 12px 7px,var(--gold) 0 3px,transparent 3.5px) 0 0/24px 14px,
  linear-gradient(var(--bronze),var(--bronze)) 0 0/100% 2px no-repeat,
  linear-gradient(var(--bronze),var(--bronze)) 0 100%/100% 2px no-repeat,var(--lapis-d)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 14px}
.brand h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,7vw,52px);line-height:1;margin:0;color:var(--gold-l);
  text-shadow:0 2px 0 #7a5a1c,0 4px 12px rgba(0,0,0,.5);letter-spacing:.02em}
.brand p{margin:6px 0 0;color:#cfdcf2;font-style:italic;font-size:16px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{font:700 14px var(--head);letter-spacing:.06em;color:var(--gold-l);background:linear-gradient(#5b3a1c,#3a2410);border:1px solid var(--bronze);padding:8px 12px;border-radius:6px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
nav.tabs button[aria-selected="true"]{background:linear-gradient(var(--gold-l),var(--gold));color:var(--ink)}

/* juego */
.game{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media (max-width:920px){.game{grid-template-columns:1fr}}
.boardbox{width:100%;max-width:700px;margin:0 auto;container-type:inline-size}
.board{position:relative;display:grid;aspect-ratio:1;width:100%;grid-template-columns:1.45fr repeat(9,1fr) 1.45fr;grid-template-rows:1.45fr repeat(9,1fr) 1.45fr;gap:1px;
  padding:1.2cqi;border-radius:1.4cqi;background:repeating-linear-gradient(88deg,#5a3719 0 3px,#4a2c14 3px 7px,#553316 7px 9px);
  box-shadow:inset 0 0 0 .5cqi var(--bronze),inset 0 0 0 .9cqi #3a2410,0 14px 34px rgba(0,0,0,.55)}
.tile{position:relative;background-color:var(--papyrus);background-image:var(--papyrus-tex);color:var(--ink);display:flex;overflow:visible;cursor:pointer;border:0;padding:0;font:inherit;text-align:center;box-shadow:inset 0 0 0 1px rgba(90,60,20,.35)}
.tile .band{flex:0 0 22%;display:flex;align-items:center;justify-content:center;gap:1px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}
.tile .txt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1px;min-width:0;overflow:hidden}
.tile .nm{font-family:var(--head);font-weight:700;font-size:1.45cqi;line-height:1.05;word-break:break-word;color:var(--ink)}
.tile .pr{font-size:1.45cqi;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-weight:600}
.tile .ic{font-size:2.8cqi;line-height:1;color:var(--sepia)}
.s-b{flex-direction:column}.s-t{flex-direction:column-reverse}.s-l{flex-direction:row-reverse}.s-r{flex-direction:row}
.s-l .band,.s-r .band{flex-direction:column}
.tile.corner{background-color:var(--papyrus-2);flex-direction:column;align-items:center;justify-content:center;padding:2px}
.tile.corner .nm{font-size:1.7cqi}
.tile.corner .ic{font-size:4.6cqi}
.tile .own{position:absolute;inset:auto 0 0 0;height:.7cqi}
.s-t .own{inset:0 0 auto 0}.s-l .own{inset:0 0 0 auto;width:.7cqi;height:auto}.s-r .own{inset:0 auto 0 0;width:.7cqi;height:auto}
.tile.mort .txt{opacity:.4}
.tile.mort::after{content:"empeñada";position:absolute;left:0;right:0;top:45%;font:700 1.2cqi var(--head);color:var(--cinnabar);transform:rotate(-12deg)}
.tile.here{box-shadow:inset 0 0 0 .45cqi var(--gold),0 0 1.6cqi var(--gold)}
.house{width:1.4cqi;height:1.4cqi;background:#3f8a5c;border:1px solid #f4ecd0;border-radius:.3cqi .3cqi 0 0}
.wall{width:3.6cqi;height:1.6cqi;background:repeating-linear-gradient(90deg,#9b4a1e 0 .6cqi,#6e2f12 .6cqi .8cqi);border:1px solid #f4ecd0}
.toks{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:.3cqi;pointer-events:none;z-index:3}
.tok{width:3cqi;height:3cqi;border-radius:50%;border:.35cqi solid #f6e7b8;box-shadow:0 .3cqi .6cqi rgba(0,0,0,.6),inset 0 -.4cqi 0 rgba(0,0,0,.25);font:900 1.5cqi var(--head);color:#fff;display:grid;place-items:center}
.tok.hop{animation:hop .17s ease-out}
@keyframes hop{50%{transform:translateY(-1.6cqi) scale(1.15)}}
.stamp::before{content:"✠";position:absolute;inset:0;margin:auto;width:6cqi;height:6cqi;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c23a2c,var(--wax));color:#f3c9b8;display:grid;place-items:center;font-size:3cqi;z-index:4;animation:stamp .9s ease-out forwards}
@keyframes stamp{0%{transform:scale(3);opacity:0}40%{transform:scale(.9);opacity:1}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:0}}

/* centro: rollo de papiro */
.center{grid-column:2/11;grid-row:2/11;position:relative;margin:1.2cqi 2.4cqi;background-color:var(--papyrus);background-image:var(--papyrus-tex),radial-gradient(ellipse at center,transparent 55%,rgba(120,80,20,.28));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.3cqi;padding:2cqi 3cqi;text-align:center;box-shadow:0 .6cqi 1.4cqi rgba(0,0,0,.45);overflow:auto}
.rolls{grid-column:2/11;grid-row:2/11;position:relative;pointer-events:none;z-index:2}
.rolls::before,.rolls::after{content:"";position:absolute;top:0;bottom:0;width:2.6cqi;border-radius:1.3cqi;background:linear-gradient(90deg,#3b230e,#8a5a2b 45%,#c89a55 55%,#5a3719);box-shadow:0 .4cqi 1cqi rgba(0,0,0,.5)}
.rolls::before{left:.6cqi}.rolls::after{right:.6cqi}
.center .logo{font-family:var(--display);font-weight:900;font-size:5.6cqi;color:#7a4e14;line-height:1;text-shadow:0 1px 0 #fff6d6}
.center .sub{font-size:max(12px,2.1cqi);color:var(--ink-soft);font-style:italic}
.turn{font:700 max(13px,2.4cqi) var(--head);display:flex;align-items:center;gap:1cqi;color:var(--ink)}
.dot{display:inline-grid;place-items:center;width:max(16px,2.8cqi);height:max(16px,2.8cqi);border-radius:50%;border:2px solid #f6e7b8;box-shadow:0 1px 3px rgba(0,0,0,.5);font:900 max(9px,1.4cqi) var(--head);color:#fff;flex:0 0 auto}
.dice{display:flex;gap:2cqi;perspective:400px}
.die{width:8.5cqi;height:8.5cqi;min-width:34px;min-height:34px;background:radial-gradient(circle at 30% 25%,#fffdf3,#e9dcb9 70%,#cbb989);border-radius:1.6cqi;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:1.1cqi;box-shadow:0 .5cqi 0 #9c875a,0 .8cqi 1.4cqi rgba(0,0,0,.4)}
.die i{width:1.7cqi;height:1.7cqi;min-width:6px;min-height:6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6b3f1a,#2a1606);place-self:center}
.die.tumble{animation:tumble .12s linear infinite}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(90deg) translateY(-6px)}50%{transform:rotate(180deg)}75%{transform:rotate(270deg) translateY(-3px)}100%{transform:rotate(360deg)}}
.btns{display:flex;gap:1.2cqi;flex-wrap:wrap;justify-content:center}
.btn{font:700 max(13px,2.2cqi) var(--head);letter-spacing:.04em;border:1px solid #7a5a1c;border-radius:.8em;padding:.55em 1.1em;cursor:pointer;color:#2a1a06;
  background:linear-gradient(180deg,var(--gold-l),var(--gold) 55%,#b98a2c);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 0 #7a5a1c,0 4px 8px rgba(0,0,0,.3);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 0 #7a5a1c}
.btn.alt{background:linear-gradient(#f4ead0,#dccb9d);border-color:#9c875a;box-shadow:0 3px 0 #9c875a}
.btn.red{background:linear-gradient(#d65a44,var(--cinnabar));color:#fff4e0;border-color:#6e1f12;box-shadow:0 3px 0 #6e1f12}
.btn.green{background:linear-gradient(#5fb07f,var(--malachite));color:#f2fff6;border-color:#1f5a3a;box-shadow:0 3px 0 #1f5a3a}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.big{font-size:max(15px,2.6cqi)}
.msg{font-size:max(13px,2.2cqi);color:var(--ink);max-width:96%;min-height:2.6em;font-style:italic}
.season{font:700 max(11px,1.8cqi) var(--head);padding:.3em .9em;border-radius:99px;background:rgba(168,50,31,.12);color:var(--cinnabar);border:1px solid rgba(168,50,31,.45);letter-spacing:.05em}
.code{font:900 max(26px,6cqi) var(--head);letter-spacing:.25em;color:var(--wax)}
.setup{display:flex;flex-direction:column;gap:1.2cqi;width:100%;max-width:96%;font-size:max(13px,2.1cqi)}
.setup .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.setup input[type=text]{flex:1;min-width:0;font:inherit;padding:5px 8px;border-radius:6px;border:1px solid var(--sepia);background:#fff8e2;color:var(--ink)}
.setup select{font:inherit;padding:4px;border-radius:6px;background:#fff8e2;color:var(--ink);border:1px solid var(--sepia)}
.setup label{display:flex;gap:4px;align-items:center;white-space:nowrap}
.lob{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:max(13px,2.1cqi)}
.lob li{display:flex;align-items:center;gap:8px;justify-content:center}
.small{font-size:max(12px,1.8cqi);color:var(--ink-soft)}

/* panel lateral: pergaminos */
aside.side{display:flex;flex-direction:column;gap:14px}
.parch{background-color:var(--papyrus);background-image:var(--papyrus-tex),radial-gradient(ellipse at center,transparent 60%,rgba(120,80,20,.25));color:var(--ink);border-radius:4px;padding:14px 16px;box-shadow:0 6px 16px rgba(0,0,0,.4);position:relative}
.parch h3{font:700 17px var(--head);margin:0 0 6px;color:#6e4318;letter-spacing:.06em;text-transform:uppercase}
.pl{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px dashed rgba(107,83,53,.4);position:relative}
.pl:first-of-type{border-top:0}
.pl .nm{font-weight:700;font-size:17px}
.pl .cash{font-variant-numeric:tabular-nums;font-weight:700;color:#6e4318;font-size:17px}
.pl .props{grid-column:2/4;display:flex;flex-wrap:wrap;gap:3px}
.pl .props span{width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.25)}
.pl .badges{grid-column:2/4;display:flex;gap:4px;flex-wrap:wrap}
.pl .badges span{font-size:12px;background:#f7e6b0;border:1px solid var(--bronze);border-radius:99px;padding:0 6px;color:#6e4318}
.pl.out{opacity:.45;text-decoration:line-through}
.pl.cur{background:linear-gradient(90deg,rgba(227,182,74,.35),transparent);margin-inline:-8px;padding-inline:8px;border-radius:4px}
.tag{font:600 12px var(--body);padding:0 6px;border-radius:99px;background:rgba(107,83,53,.15);color:var(--ink-soft);margin-left:4px}
.float{position:absolute;right:6px;top:4px;font:900 18px var(--head);pointer-events:none;animation:floatup 1.4s ease-out forwards;z-index:5}
.float.plus{color:var(--malachite)}.float.minus{color:var(--cinnabar)}
@keyframes floatup{0%{opacity:0;transform:translateY(8px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-34px)}}
.log{list-style:none;margin:0;padding:0;font-size:15px;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px}
.log li:first-child{color:var(--ink);font-weight:600}
.lastcard{border-left:4px solid var(--wax);padding-left:10px}
.lastcard .deck{font:700 11px var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--wax)}
.lastcard b{font-family:var(--head);display:block;font-size:17px}

/* modales */
.modal-bg{position:fixed;inset:0;background:rgba(6,14,34,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.scroll{position:relative;background-color:var(--papyrus);background-image:var(--papyrus-tex),radial-gradient(ellipse at center,transparent 55%,rgba(120,80,20,.3));color:var(--ink);width:min(380px,100%);max-height:90vh;overflow:auto;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.6);padding:22px 20px 18px}
.scroll::before,.scroll::after{content:"";position:absolute;left:-6px;right:-6px;height:12px;border-radius:6px;background:linear-gradient(#8a5a2b,#c89a55 50%,#5a3719)}
.scroll::before{top:-6px}.scroll::after{bottom:-6px}
.seal{width:54px;height:54px;border-radius:50%;margin:-6px auto 8px;background:radial-gradient(circle at 38% 32%,#d0493a,var(--wax) 60%,#5c120e);color:#f6c9b6;display:grid;place-items:center;font-size:24px;box-shadow:0 3px 6px rgba(0,0,0,.4),inset 0 0 0 4px rgba(255,255,255,.08)}
.scroll .kind{font:700 12px var(--head);letter-spacing:.18em;text-transform:uppercase;text-align:center;color:var(--wax)}
.scroll h2{font:900 26px var(--head);text-align:center;margin:2px 0 10px;line-height:1.15;color:#3b2408;text-wrap:balance}
.scroll p{margin:0 0 8px;font-size:18px}
.scroll .ref{font-style:italic;color:var(--ink-soft);text-align:center;font-size:15px}
.scroll .acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.flip{perspective:900px;width:min(360px,100%)}
.flip .inner{position:relative;transform-style:preserve-3d;animation:flip .7s ease-out forwards}
.flip .back{position:absolute;inset:0;backface-visibility:hidden;border-radius:4px;background:repeating-linear-gradient(45deg,#6e4522 0 10px,#5a3719 10px 20px);border:4px solid var(--bronze);display:grid;place-items:center;transform:rotateY(0)}
.flip .back span{font:900 30px var(--display);color:var(--gold-l)}
.flip .front{backface-visibility:hidden;transform:rotateY(180deg)}
.flip .scroll{width:100%}
@keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{font:600 17px var(--body);text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--sepia);background:#fff8e2;color:var(--ink);cursor:pointer}
.opt:disabled{cursor:default}
.opt.ok{background:#cfe9d6;border-color:var(--malachite);font-weight:700}
.opt.bad{background:#f3cfc6;border-color:var(--cinnabar)}
.deedtab{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
.deedtab td{padding:3px 0;border-bottom:1px dotted #a68b5b}
.deedtab td:last-child{text-align:right;font-weight:700}
.deedhd{margin:-22px -20px 12px;padding:14px 16px;color:#fff;text-align:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.deedhd small{display:block;font:700 11px var(--head);letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.deedhd b{font:900 25px var(--head);display:block;line-height:1.1}
.fact{font-size:17px;background:rgba(255,250,232,.7);border-radius:6px;padding:10px;border-left:4px solid var(--bronze);margin:10px 0}
.fact em{display:block;font-size:14px;color:var(--ink-soft);margin-top:4px}
.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.field select,.field input{font:inherit;padding:5px 8px;border-radius:6px;border:1px solid var(--sepia);background:#fff8e2;color:var(--ink);min-width:0}
.field input{width:100px}

/* estandarte de acontecimientos */
.banner{position:fixed;inset:0;display:grid;place-items:center;z-index:30;pointer-events:none;padding:16px}
.banner .box{position:relative;text-align:center;padding:22px 26px;border-radius:6px;max-width:520px;width:100%;animation:bannerIn 2.8s ease-in-out forwards;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.banner .box b{display:block;font:900 clamp(24px,6vw,40px) var(--head);line-height:1.1;text-wrap:balance}
.banner .box span{display:block;font:italic 18px var(--body);margin-top:6px}
.banner.fire .box{background:radial-gradient(circle at 50% 120%,#f08a2a,#8e1f1a 60%,#2a0906);color:#ffe9c2}
.banner.gold .box{background:radial-gradient(circle,#fff0bf,#e3b64a 60%,#8a6a1c);color:#3b2408}
.banner.blue .box{background:radial-gradient(circle,#3d6fc0,#16366f);color:#f6dc8e;border:2px solid var(--gold)}
.banner.dark .box{background:linear-gradient(#2b2b2b,#111);color:#f0e2c0;border:2px solid #777}
.banner.green .box{background:radial-gradient(circle,#6cc28f,#1f5a3a);color:#f4fff0}
@keyframes bannerIn{0%{opacity:0;transform:scale(.6) rotate(-2deg)}12%{opacity:1;transform:scale(1.05)}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.03)}}
.p{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;animation:rise 2.4s ease-out forwards}
.fire .p{background:#ffb347;box-shadow:0 0 8px #ff7b00}
.gold .p,.green .p,.blue .p{background:#fff5c7;box-shadow:0 0 6px #ffd76a}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-240px) translateX(var(--dx));opacity:0}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* textos */
.doc{background-color:var(--papyrus);background-image:var(--papyrus-tex);color:var(--ink);padding:20px clamp(16px,4vw,40px) 30px;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.45);position:relative;margin-top:10px}
.doc::before,.doc::after{content:"";position:absolute;left:-8px;right:-8px;height:16px;border-radius:8px;background:linear-gradient(#8a5a2b,#c89a55 50%,#5a3719)}
.doc::before{top:-8px}.doc::after{bottom:-8px}
.doc h2{font:900 30px var(--head);color:#5c3810;margin:10px 0 6px;text-wrap:balance}
.doc h3{font:700 21px var(--head);color:#6e4318;margin:24px 0 4px;letter-spacing:.03em}
.doc > p,.doc > ul,.doc > ol,.doc .note p{max-width:68ch}
.doc a{color:#7a2a14}
.note{background:rgba(142,31,26,.07);border:1px solid rgba(142,31,26,.3);border-radius:8px;padding:6px 16px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:10px}
.mini{background:#fff8e2;border:1px solid #c9b07a;border-top:6px solid var(--wax);border-radius:6px;padding:12px;color:var(--ink)}
.mini .deck{font:700 11px var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--wax)}
.mini h4{font:700 18px var(--head);margin:2px 0 4px;color:#3b2408}
.mini p{margin:0;font-size:16px;color:var(--ink)}
.mini .ref{font-style:italic;font-size:14px;color:var(--ink-soft);margin-top:6px}
.mini.acn{border-top-color:#b3531c}.mini.par{border-top-color:#5c3810}.mini.sab{border-top-color:var(--malachite)}.mini.ach{border-top-color:var(--gold)}
.mini.deedmini{border-top:0;padding:0;overflow:hidden}
.mini.deedmini .hd{color:#fff;text-align:center;padding:8px}
.mini.deedmini .hd b{font:700 18px var(--head)}
.mini.deedmini .bd{padding:8px 12px}
.money{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.money div{background:#fff8e2;border:1px solid #c9b07a;border-radius:8px;padding:10px}
.money b{font:700 18px var(--head);color:#6e4318;display:block}
</style>
</head>
<body>

<div class="frieze" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Bibliópolis</h1>
      <p>Recorre la tierra de la Biblia, adquiere ciudades y guarda la Ley del Jubileo.</p>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-jugar" aria-selected="true" data-tab="jugar">Jugar</button>
      <button role="tab" id="tab-reglas" aria-selected="false" data-tab="reglas">Reglamento</button>
      <button role="tab" id="tab-cartas" aria-selected="false" data-tab="cartas">Cartas y títulos</button>
    </nav>
  </header>

  <section id="v-jugar">
    <div class="game">
      <div class="boardbox"><div class="board" id="board"></div></div>
      <aside class="side">
        <div class="parch" id="players"><h3>Jugadores</h3></div>
        <div class="parch" id="cardbox" hidden></div>
        <div class="parch"><h3>Crónica</h3><ul class="log" id="log"></ul></div>
      </aside>
    </div>
  </section>
  <section id="v-reglas" class="doc" hidden></section>
  <section id="v-cartas" class="doc" hidden></section>
</div>
<div id="modal"></div>
<div id="bannerbox"></div>

const SIDE=i=>i%10===0?'c':i<10?'b':i<20?'l':i<30?'t':'r';
function cell(i){ if(i<=10) return [11,11-i]; if(i<=20) return [11-(i-10),1]; if(i<=30) return [1,1+(i-20)]; return [1+(i-30),11]; }
const FAST=location.hash==='#fast';
const T=ms=>FAST?0:ms;

/* =================== UTIL =================== */
const $=s=>document.querySelector(s);
const d6=()=>1+Math.floor(Math.random()*6);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const idxs=n=>shuffle([...Array(n).keys()]);
const rid=()=>Math.random().toString(36).slice(2,10);
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hash(s){let h=5381;for(const c of String(s))h=((h*33)^c.charCodeAt(0))>>>0;return h.toString(36)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
const MYTOK=lsGet('bib-tok')||(()=>{const t=rid()+rid();lsSet('bib-tok',t);return t})();

/* =================== MOTOR (lo ejecuta este equipo si es local o anfitrión) =================== */
let S=null;          // estado completo
let MODE='none';     // none | local | host | guest
let MYSEAT=null;

function E(e){S.evn++;e.id=S.evn;S.ev.push(e);while(S.ev.length>10)S.ev.shift()}
function log(t){S.log.unshift(String(t).slice(0,120));S.log=S.log.slice(0,6)}
const P=i=>S.players[i];
const idx=p=>S.players.indexOf(p);
const cur=()=>S.players[S.turn];
function cash(p,d){if(!d)return;p.cash+=d;E({k:'$',p:idx(p),d})}
const buyable=i=>BUY.includes(i);
const groupIdx=g=>SP.map((s,i)=>s.g===g?i:-1).filter(i=>i>=0);
function ownsGroup(pi,g){return groupIdx(g).every(i=>S.props[i].o===pi)}
const sabbatical=()=>S.round%7===0;

function newState(players,rounds,code){
  S={gid:rid(),v:0,evn:0,ev:[],code:code||'',players:players.map((p,k)=>({n:(p.n||('Jugador '+(k+1))).slice(0,14),c:k,cash:1500,pos:0,refuge:false,rt:0,priest:0,fish:0,out:false,cpu:!!p.cpu,tok:p.tok||null,skip:0,laps:0,qok:0,gave:0,walls:0,sold:0,ach:[]})),
     props:{},turn:0,round:1,maxRounds:rounds,phase:'roll',dice:[3,4],dbl:0,again:false,pend:null,card:null,q:null,offer:null,msg:'',log:[],over:false,
     dp:idxs(PARABOLAS.length),ds:idxs(SABIDURIA.length),da:idxs(ACN.length),dq:idxs(QS.length),seen:{}};
  BUY.forEach(i=>S.props[i]={o:null,h:0,m:false});
  log('Comienza la partida. Cada jugador recibe 1500 siclos.');
  S.msg=cur().n+', tira los dados.';
}

function rentFor(i,dice){
  const s=SP[i],pr=S.props[i];if(pr.o==null||pr.m)return 0;
  if(s.t==='prop'){const b=BASE[s.p];return pr.h===0?b*(ownsGroup(pr.o,s.g)?2:1):b*MULT[pr.h]}
  if(s.t==='route'){const n=BUY.filter(k=>SP[k].t==='route'&&S.props[k].o===pr.o).length;return 25*Math.pow(2,n-1)}
  if(s.t==='well'){const n=BUY.filter(k=>SP[k].t==='well'&&S.props[k].o===pr.o).length;return (n===2?10:4)*dice}
  return 0;
}
function worth(p){const pi=idx(p);let w=p.cash;BUY.forEach(k=>{const pr=S.props[k];if(pr.o===pi){w+=pr.m?SP[k].p/2:SP[k].p;if(pr.h)w+=pr.h*GR[SP[k].g].h}});return w}
function raise(p,amt){
  const pi=idx(p);const mine=BUY.filter(k=>S.props[k].o===pi).sort((a,b)=>SP[a].p-SP[b].p);let guard=60;
  while(p.cash<amt&&guard--){const k=mine.filter(k=>S.props[k].h>0).sort((a,b)=>S.props[b].h-S.props[a].h)[0];if(k==null)break;S.props[k].h--;cash(p,GR[SP[k].g].h/2);log(p.n+' vende una casa en '+SP[k].n+'.')}
  for(const k of mine){if(p.cash>=amt)break;if(!S.props[k].m){S.props[k].m=true;cash(p,SP[k].p/2);log(p.n+' empeña '+SP[k].n+'.')}}
}
function charge(p,amt,to){
  if(amt<=0||p.out)return true;
  if(p.cash<amt)raise(p,amt);
  if(p.cash<amt){bankrupt(p,to);return false}
  cash(p,-amt);if(to)cash(to,amt);return true;
}
function bankrupt(p,to){
  const pi=idx(p);
  if(to&&p.cash>0)cash(to,p.cash);
  log(p.n+' queda en bancarrota. Sus tierras vuelven al banco.');
  E({k:'bn',s:'dark',h:'Bancarrota',x:p.n+' no puede pagar y deja la partida.'});
  p.cash=0;p.out=true;p.refuge=false;
  BUY.forEach(k=>{if(S.props[k].o===pi)S.props[k]={o:null,h:0,m:false}});
  if(S.offer&&(S.offer.f===pi||S.offer.to===pi))S.offer=null;
  if(S.players.filter(x=>!x.out).length<=1)endGame();
}
function endGame(){
  if(S.over)return;S.over=true;S.phase='over';S.offer=null;S.q=null;
  const rank=S.players.filter(p=>!p.out).sort((a,b)=>worth(b)-worth(a));const w=rank[0];
  S.msg=w?('¡'+w.n+' gana con un patrimonio de '+worth(w)+' siclos!'):'Fin de la partida.';
  log(S.msg);E({k:'bn',s:'gold',h:w?w.n+' gana':'Fin',x:w?'Patrimonio: '+worth(w)+' siclos':''});
}
function sendRefuge(p,why){p.pos=10;p.refuge=true;p.rt=0;S.again=false;E({k:'jp',p:idx(p),to:10});log(p.n+(why||' huye a la ciudad de refugio.'))}
function passGo(p){p.laps++;cash(p,200);log(p.n+' pasa por Día de pago y cobra 200.')}
function move(p,steps){
  const from=p.pos,np=(from+steps+40)%40;
  E({k:'mv',p:idx(p),f:from,n:steps});
  if(steps>0&&np<from)passGo(p);
  p.pos=np;
}
function moveTo(p,i){const n=(i-p.pos+40)%40;move(p,n===0?0:n);land(p)}

function land(p){
  const i=p.pos,s=SP[i],pi=idx(p);
  S.pend=null;
  if(buyable(i)){
    const pr=S.props[i];
    if(pr.o==null){S.pend=i;S.phase='buy';S.msg=p.n+' llega a '+s.n+'. ¿Comprar por '+s.p+' siclos?';return}
    if(pr.o===pi){S.msg=p.n+' descansa en su propia tierra: '+s.n+'.';return}
    if(pr.m){S.msg=s.n+' está empeñada: no se cobra renta.';return}
    const o=P(pr.o);
    if(sabbatical()){S.msg='Año sabático: la tierra descansa y '+o.n+' no cobra renta.';log(S.msg);return}
    let r=rentFor(i,S.dice[0]+S.dice[1]),note='';
    if(p.cash<200){r=Math.ceil(r/2);note=' (rebusca: la mitad)'}
    if(charge(p,r,o)){S.msg=p.n+' paga '+r+' siclos a '+o.n+' por '+s.n+note+'.';log(S.msg)}
    return;
  }
  switch(s.t){
    case 'tax':
      if(p.fish){p.fish--;S.msg=p.n+' usa el estater del pez y no paga.';log(S.msg);break}
      if(charge(p,s.amt,null)){S.msg=p.n+' paga '+s.amt+' siclos: '+s.n+'.';log(S.msg)}break;
    case 'avenger':sendRefuge(p,' huye: el vengador de la sangre lo persigue.');S.msg=p.n+' corre a la ciudad de refugio.';E({k:'bn',s:'dark',h:'¡El vengador de la sangre!',x:p.n+' huye a la ciudad de refugio.'});break;
    case 'refuge':S.msg=p.n+' visita la ciudad de refugio.';break;
    case 'rest':case 'go':startQuiz(p,s.t==='rest'?'Guarda el sábado y responde:':'En Día de pago, una pregunta extra:');break;
    case 'par':drawCard(p,'par');break;
    case 'sab':drawCard(p,'sab');break;
    case 'acn':drawCard(p,'acn');break;
  }
}
function startQuiz(p,intro){
  if(!S.dq.length)S.dq=idxs(QS.length);
  const qi=S.dq.shift();
  S.q={id:rid(),i:qi,p:idx(p),o:shuffle([0,1,2,3]),a:-1};
  S.phase='quiz';S.msg=p.n+': '+intro;
}
function answer(k){
  const q=S.q,p=P(q.p);q.a=k;S.qAt=Date.now();
  const ok=q.o[k]===0;
  if(ok){p.qok++;cash(p,100);S.msg=p.n+' acierta y cobra 100 siclos.'}
  else S.msg=p.n+' no acertó. La respuesta era: '+QS[q.i].o[0]+'.';
  log(S.msg);E({k:'qa',ok});
}
function drawCard(p,deck){
  const arr=deck==='par'?PARABOLAS:deck==='sab'?SABIDURIA:ACN,key=deck==='par'?'dp':deck==='sab'?'ds':'da';
  if(!S[key].length)S[key]=idxs(arr.length);
  const ci=S[key].shift(),c=arr[ci];
  S.card={d:deck,i:ci};
  E({k:'cd',d:deck,i:ci,p:idx(p)});
  log(p.n+' saca «'+c.h+'».');
  S.msg=p.n+' saca «'+c.h+'».';
  applyCard(p,c.e);
}
function alive(){return S.players.filter(x=>!x.out)}
function applyCard(p,e){
  const pi=idx(p);
  const houses=x=>{let h=0,w=0;BUY.forEach(k=>{const pr=S.props[k];if(pr.o===idx(x)){if(pr.h===5)w++;else h+=pr.h}});return[h,w]};
  switch(e.t){
    case 'gain':cash(p,e.n);break;
    case 'pay':charge(p,e.n,null);break;
    case 'allGain':alive().forEach(x=>cash(x,e.n));break;
    case 'allPay':alive().forEach(x=>charge(x,e.n,null));break;
    case 'poorest':{const others=alive().filter(x=>x!==p);if(!others.length)break;const poor=others.sort((a,b)=>a.cash-b.cash)[0];if(charge(p,e.n,poor))p.gave+=e.n;break}
    case 'payEach':alive().filter(x=>x!==p).forEach(x=>{if(!p.out&&charge(p,e.n,x))p.gave+=e.n});break;
    case 'generous':alive().filter(x=>x!==p).forEach(x=>{if(!p.out&&charge(p,20,x))p.gave+=20});if(!p.out)cash(p,100);break;
    case 'repairs':{const[h,w]=houses(p);charge(p,h*e.a+w*e.b,null);break}
    case 'perHouse':alive().forEach(x=>{const[h,w]=houses(x);charge(x,h*e.a+w*e.b,null)});break;
    case 'perProp':alive().forEach(x=>{const n=BUY.filter(k=>S.props[k].o===idx(x)).length;charge(x,n*e.n,null)});break;
    case 'forgive':{const k=BUY.find(k=>S.props[k].o===pi&&S.props[k].m);if(k!=null){S.props[k].m=false;log('Se cancela el empeño de '+SP[k].n+'.')}break}
    case 'moveTo':moveTo(p,e.i);break;
    case 'back':move(p,-e.n);land(p);break;
    case 'refuge':sendRefuge(p);break;
    case 'keep':p[e.k]++;break;
    case 'jope':moveTo(p,15);if(!p.out)charge(p,30,null);break;
    case 'skip':p.skip=1;S.again=false;break;
    case 'raze':e.i.forEach(k=>{if(S.props[k].h){S.props[k].h=0;E({k:'rz',i:k})}});
      {const o=S.props[e.i[0]].o;if(e.pay&&o!=null)charge(P(o),e.pay,null)}
      if(e.bi!=null&&S.props[e.bi].o!=null)cash(P(S.props[e.bi].o),e.n);break;
    case 'razeGroup':groupIdx(e.g).forEach(k=>{if(S.props[k].h){S.props[k].h--;E({k:'rz',i:k})}});
      if(e.bi!=null&&S.props[e.bi].o!=null)cash(P(S.props[e.bi].o),e.n);break;
    case 'cyrus':S.players.forEach(x=>{x.refuge=false;x.rt=0});if(S.props[39].o!=null&&S.props[39].h<5){S.props[39].h++;E({k:'bd',i:39})}break;
    case 'routeBonus':alive().forEach(x=>{const n=BUY.filter(k=>SP[k].t==='route'&&S.props[k].o===idx(x)).length;cash(x,n*e.n)});break;
    case 'wellBonus':alive().forEach(x=>{const n=BUY.filter(k=>SP[k].t==='well'&&S.props[k].o===idx(x)).length;cash(x,n*e.n)});break;
    case 'giftTo':cash(S.props[e.i].o!=null?P(S.props[e.i].o):p,e.n);break;
    case 'freeHouse':{const k=BUY.filter(k=>SP[k].t==='prop'&&S.props[k].o===pi&&ownsGroup(pi,SP[k].g)&&S.props[k].h<5).sort((a,b)=>S.props[a].h-S.props[b].h)[0];if(k!=null){S.props[k].h++;E({k:'bd',i:k});log(p.n+' construye gratis en '+SP[k].n+'.')}else log(p.n+' no tiene grupos completos donde construir.');break}
  }
}
function checkAch(){
  S.players.forEach((p,pi)=>{
    if(p.out)return;
    const own=BUY.filter(k=>S.props[k].o===pi);
    const cond={a:S.props[1].o===pi&&S.props[3].o===pi,b:p.walls>0,c:own.filter(k=>SP[k].t==='route').length>=3,d:p.laps>=3,e:p.qok>=3,f:S.props[39].o===pi,g:own.length>=8,h:p.gave>=100,i:p.sold>0};
    ACH.forEach(a=>{if(cond[a.id]&&!p.ach.includes(a.id)){p.ach.push(a.id);cash(p,a.n);log(p.n+' logra «'+a.h+'» y cobra '+a.n+'.');E({k:'ac',p:pi,a:a.id})}});
  });
}

/* ----- turnos ----- */
function roll(){
  const p=cur(),a=d6(),b=d6();S.dice=[a,b];S.card=null;S.q=null;const dbl=a===b;
  E({k:'dc',a,b});
  if(p.refuge){
    if(dbl){p.refuge=false;p.rt=0;log(p.n+' saca dobles y sale del refugio.');S.again=false;S.msg='';move(p,a+b);land(p);return afterLand()}
    p.rt++;
    if(p.rt>=3){p.refuge=false;p.rt=0;log('Muere el sumo sacerdote: '+p.n+' sale del refugio.');S.again=false;S.msg='';move(p,a+b);land(p);return afterLand()}
    S.msg=p.n+' sigue en la ciudad de refugio ('+p.rt+'/3). No se acepta rescate.';S.phase='end';return;
  }
  if(dbl){S.dbl++;if(S.dbl>=3){sendRefuge(p,' saca tres dobles y huye al refugio.');S.msg=p.n+' va a la ciudad de refugio.';S.phase='end';return}}
  S.again=dbl;S.msg='';move(p,a+b);land(p);afterLand();
}
function afterLand(){
  const p=cur();if(S.over)return;
  if(p.out){S.phase='end';return}
  if(S.phase==='buy'||S.phase==='quiz')return;
  S.phase=(S.again&&!p.refuge&&!p.skip)?'roll':'end';
  if(S.phase==='roll')S.msg+=' Sacaste dobles: tira otra vez.';
}
function buy(yes){
  const p=cur(),i=S.pend;
  if(yes&&p.cash>=SP[i].p){cash(p,-SP[i].p);S.props[i].o=S.turn;S.msg=p.n+' compra '+SP[i].n+'.';log(S.msg);E({k:'by',i,p:S.turn})}
  else S.msg=p.n+' no compra '+SP[i].n+'.';
  S.pend=null;S.phase='x';afterLand();
}
function endTurn(){
  S.dbl=0;S.again=false;S.card=null;S.q=null;
  let n=S.turn,wrapped=false;
  do{n=(n+1)%S.players.length;if(n===0)wrapped=true}while(S.players[n].out);
  S.turn=n;
  if(wrapped){S.round++;
    if(S.round>S.maxRounds){endGame();return}
    if(S.round%25===0){BUY.forEach(k=>S.props[k].m=false);S.players.forEach(x=>{x.refuge=false;x.rt=0});log('¡Suena el cuerno! Año de Jubileo.');E({k:'bn',s:'gold',h:'¡Año de Jubileo!',x:'Suena el cuerno: se cancelan los empeños y los refugiados quedan libres.'})}
    else if(sabbatical()){log('Ronda '+S.round+': año sabático.');E({k:'bn',s:'blue',h:'Año sabático',x:'La tierra descansa: nadie cobra renta esta ronda.'})}
    else if(S.round%4===0){drawCard(cur(),'acn');S.phase='roll';}
  }
  if(S.over){S.phase='over';return}
  let g=8;while(cur().out&&g--){S.turn=(S.turn+1)%S.players.length}
  const p=cur();
  if(p.skip){p.skip=0;S.phase='end';S.msg=p.n+' sigue en la cisterna y pierde este turno.';log(S.msg);return}
  S.phase='roll';S.msg=p.n+', tira los dados.';
  if(S.over)S.phase='over';
}
function canBuildI(i,pi){const s=SP[i],pr=S.props[i];if(s.t!=='prop'||pr.o!==pi||pr.h>=5)return false;if(!ownsGroup(pi,s.g))return false;if(groupIdx(s.g).some(k=>S.props[k].m))return false;return P(pi).cash>=GR[s.g].h}
function groupClear(i){const s=SP[i];return s.t!=='prop'||groupIdx(s.g).every(k=>S.props[k].h===0)}

/* ----- acciones (validadas) ----- */
function act(seat,a){
  if(!S||S.over||seat==null||seat<0||seat>=S.players.length)return false;
  const p=P(seat);if(p.out)return false;
  const myTurn=seat===S.turn;
  const t=a.t,i=+a.i;
  if(t==='oyes'||t==='ono'){if(!S.offer||S.offer.to!==seat)return false;respondOffer(t==='oyes');return true}
  if(t==='ocancel'){if(!S.offer||S.offer.f!==seat)return false;log(p.n+' retira su oferta.');S.offer=null;return true}
  if(S.offer)return false;
  if(t==='ans'){if(S.phase!=='quiz'||!S.q||S.q.p!==seat||S.q.a>=0)return false;const k=+a.k;if(!(k>=0&&k<4))return false;answer(k);S.phase='x';afterLand();return true}
  if(!myTurn)return false;
  switch(t){
    case 'roll':if(S.phase!=='roll')return false;roll();return true;
    case 'buy':if(S.phase!=='buy')return false;buy(true);return true;
    case 'pass':if(S.phase!=='buy')return false;buy(false);return true;
    case 'end':if(S.phase!=='end')return false;endTurn();return true;
    case 'priest':if(S.phase!=='roll'||!p.refuge||!p.priest)return false;p.priest--;p.refuge=false;p.rt=0;log(p.n+' usa la carta del sumo sacerdote y sale del refugio.');S.msg=p.n+' queda libre. Tira los dados.';return true;
  }
  if(!(S.phase==='roll'||S.phase==='end')||!buyable(i))return false;
  const pr=S.props[i],s=SP[i];if(pr.o!==seat)return false;
  switch(t){
    case 'build':if(!canBuildI(i,seat))return false;cash(p,-GR[s.g].h);pr.h++;if(pr.h===5)p.walls++;log(p.n+(pr.h===5?' levanta una muralla en ':' construye una casa en ')+s.n+'.');E({k:'bd',i});return true;
    case 'sellh':if(!pr.h)return false;pr.h--;cash(p,GR[s.g].h/2);log(p.n+' vende una construcción en '+s.n+'.');return true;
    case 'mort':if(pr.m||!groupClear(i))return false;pr.m=true;cash(p,s.p/2);log(p.n+' empeña '+s.n+' sin interés.');return true;
    case 'unmort':if(!pr.m||p.cash<s.p/2)return false;cash(p,-s.p/2);pr.m=false;log(p.n+' recupera '+s.n+'.');return true;
    case 'bank':if(pr.m||!groupClear(i))return false;cash(p,Math.floor(s.p*0.7));S.props[i]={o:null,h:0,m:false};log(p.n+' vende '+s.n+' al banco por '+Math.floor(s.p*0.7)+'.');E({k:'rz',i});return true;
    case 'offer':{const to=+a.to,price=Math.max(1,Math.min(5000,Math.floor(+a.pr||0)));if(pr.m||!groupClear(i)||!(to>=0&&to<S.players.length)||to===seat||P(to).out)return false;
      S.offer={f:seat,to,i,pr:price,id:rid()};log(p.n+' ofrece '+s.n+' a '+P(to).n+' por '+price+'.');
      if(P(to).cpu){const b=P(to);respondOffer(b.cash-price>=150&&price<=s.p*1.4)}return true}
  }
  return false;
}
function respondOffer(yes){
  const o=S.offer;S.offer=null;const seller=P(o.f),buyer=P(o.to);
  if(yes&&buyer.cash>=o.pr&&S.props[o.i].o===o.f){cash(buyer,-o.pr);cash(seller,o.pr);S.props[o.i].o=o.to;S.props[o.i].h=0;seller.sold++;log(buyer.n+' compra '+SP[o.i].n+' a '+seller.n+' por '+o.pr+'.');E({k:'by',i:o.i,p:o.to})}
  else log(buyer.n+' rechaza la oferta por '+SP[o.i].n+'.');
}

/* ----- vista pública (lo que ven todos) ----- */
function pub(){
  if(S.phase==='lobby')return{g:S.gid,v:S.v,code:S.code,ph:'lobby',mr:S.maxRounds,lob:S.lobby.map(x=>[x.n,x.tok?hash(x.tok):'',x.cpu?1:0]),ev:[]};
  return{g:S.gid,v:S.v,code:S.code,ph:S.phase,t:S.turn,r:S.round,mr:S.maxRounds,d:S.dice,
    pl:S.players.map(p=>[p.n,p.c,p.cash,p.pos,(p.refuge?1:0)|(p.out?2:0)|(p.cpu?4:0)|(p.skip?8:0),p.rt,p.priest,p.fish,p.ach.join(''),p.tok?hash(p.tok):'']),
    pr:BUY.map(i=>{const x=S.props[i];return(x.o==null?'-':x.o)+''+x.h+(x.m?1:0)}).join(''),
    pd:S.pend,msg:S.msg,log:S.log.slice(0,4),card:S.card,q:S.q,of:S.offer,ev:S.ev};
}
function decode(V){
  if(!V||V.ph==='lobby')return V;
  V.P=V.pl.map(a=>({n:a[0],c:a[1],cash:a[2],pos:a[3],refuge:!!(a[4]&1),out:!!(a[4]&2),cpu:!!(a[4]&4),skip:!!(a[4]&8),rt:a[5],priest:a[6],fish:a[7],ach:a[8],h:a[9]}));
  V.PR={};BUY.forEach((i,k)=>{const s=V.pr.substr(k*3,3);V.PR[i]={o:s[0]==='-'?null:+s[0],h:+s[1],m:s[2]==='1'}});
  return V;
}

/* ----- confirmar cambios ----- */
function commit(){
  if(S.phase!=='lobby')checkAch();
  S.v++;
  lsSet('bib-state',JSON.stringify({mode:MODE,S}));
  const V=pub();
  broadcast(V);
  onView(decode(JSON.parse(JSON.stringify(V))));
  cpuTick();
}

/* ----- computadora ----- */
let cpuTimer=null;
function cpuTick(){
  clearTimeout(cpuTimer);
  if(!S||S.over||S.phase==='lobby'||(MODE!=='local'&&MODE!=='host'))return;
  cpuTimer=setTimeout(()=>{
    if(!S||S.over)return;
    if(busy()||(S.q&&S.q.a>=0&&Date.now()-(S.qAt||0)<T(2600))){return cpuTick()}
    const p=cur();
    if(S.phase==='quiz'&&S.q&&P(S.q.p).cpu&&S.q.a<0){const k=Math.random()<.7?S.q.o.indexOf(0):Math.floor(Math.random()*4);act(S.q.p,{t:'ans',k});return commit()}
    if(!p.cpu||S.offer)return;
    if(S.phase==='roll'){if(p.refuge&&p.priest)act(S.turn,{t:'priest'});act(S.turn,{t:'roll'})}
    else if(S.phase==='buy'){act(S.turn,{t:p.cash-SP[S.pend].p>=150?'buy':'pass'})}
    else if(S.phase==='end'){cpuManage(p);act(S.turn,{t:'end'})}
    else return;
    commit();
  },T(700));
}
function cpuManage(p){
  const pi=S.turn;
  BUY.forEach(k=>{if(S.props[k].o===pi&&S.props[k].m&&p.cash>SP[k].p+300)act(pi,{t:'unmort',i:k})});
  let guard=10;
  while(guard--){const c=BUY.filter(k=>canBuildI(k,pi)&&p.cash-GR[SP[k].g].h>=250).sort((a,b)=>S.props[a].h-S.props[b].h)[0];if(c==null)break;act(pi,{t:'build',i:c})}
}

/* =================== RED (sala en línea) =================== */
let ROOM=null,GROOM=null,roomReady=false,roomNull=false,hostPeerState=null;
(async()=>{
  await new Promise(r=>setTimeout(r,0));
  try{ROOM=window.claude&&window.claude.use?await window.claude.use('room'):null}catch(e){ROOM=null}
  roomReady=true;roomNull=!ROOM;
  if(!S&&MODE==='none')renderMenu();
})();
let RCODE='';
const hasPeer=()=>typeof window.Peer==='function';
function peerRoom(code,role){
  return new Promise((res,rej)=>{
    const hostId='bibliopolis-v2-'+code.toLowerCase();
    const handlers=[],others=new Map(),conns=new Set();let mine={},done=false;
    const list=()=>[{peer:'me',isMe:true,presence:mine},...others.values()];
    const emit=()=>{const l=list();handlers.forEach(h=>h({peers:l}))};
    const api={presence:async p=>{for(const k in p){if(p[k]===null)delete mine[k];else mine[k]=p[k]}conns.forEach(c=>{try{if(c.open)c.send({pr:mine})}catch(e){}});emit()},
      peers:list,onPeers:f=>{handlers.push(f);setTimeout(emit,0);return()=>{}},leave:async()=>{try{peer.destroy()}catch(e){}}};
    const wire=c=>{conns.add(c);
      c.on('open',()=>{try{c.send({pr:mine})}catch(e){}});
      c.on('data',d=>{if(d&&d.pr&&typeof d.pr==='object'){others.set(c.peer,{peer:c.peer,presence:d.pr});emit()}});
      c.on('close',()=>{conns.delete(c);others.delete(c.peer);emit()});c.on('error',()=>{})};
    const peer=role==='h'?new Peer(hostId):new Peer();
    peer.on('open',()=>{
      if(role==='h'){peer.on('connection',wire);done=true;res(api);return}
      const c=peer.connect(hostId,{serialization:'json',reliable:true});wire(c);
      c.on('open',()=>{if(!done){done=true;res(api)}});
      setTimeout(()=>{if(!done){done=true;rej(new Error('nohost'))}},10000)});
    peer.on('error',e=>{if(!done){done=true;rej(e)}});
  });
}
async function joinRoom(code,role){
  RCODE=code;
  if(ROOM){
    try{GROOM=await ROOM.join('bib-'+code.toLowerCase())}
    catch(e){GROOM={presence:x=>ROOM.presence(x),peers:()=>ROOM.peers(),onPeers:(f,er)=>ROOM.onPeers(f,er),leave:()=>ROOM.presence({r:null,st:null,a:null,code:null})}}
  }else if(hasPeer()){GROOM=await peerRoom(code,role)}
  else throw new Error('offline');
  GROOM.onPeers(ch=>onPeers(ch.peers.filter(pe=>pe.presence&&pe.presence.code===RCODE)),()=>{});
}
function broadcast(V){if(MODE==='host'&&GROOM){GROOM.presence({r:'h',code:RCODE,st:V}).catch(()=>{})}}
function onPeers(peers){
  if(MODE==='host'){
    if(S.phase==='lobby'){
      const guests=[];peers.forEach(pe=>{const pr=pe.presence||{};if(pr.r==='g'&&typeof pr.tok==='string'&&!guests.some(g=>g.tok===pr.tok))guests.push({n:String(pr.n||'Invitado').slice(0,14),tok:pr.tok})});
      const host=S.lobby.find(x=>x.tok===MYTOK),cpus=S.lobby.filter(x=>x.cpu);
      const next=[host,...guests.slice(0,3)];cpus.forEach(c=>{if(next.length<4)next.push(c)});
      if(JSON.stringify(next)!==JSON.stringify(S.lobby)){S.lobby=next;commit()}
      return;
    }
    let changed=false;
    peers.forEach(pe=>{const pr=pe.presence||{};if(pr.r!=='g'||!pr.a||typeof pr.a!=='object'||typeof pr.tok!=='string')return;
      const a=pr.a;if(typeof a.id!=='string'||S.seen[pr.tok]===a.id)return;S.seen[pr.tok]=a.id;
      const seat=S.players.findIndex(x=>x.tok===pr.tok);if(seat<0)return;
      if(act(seat,a))changed=true;});
    if(changed)commit();
  }else if(MODE==='guest'){
    const h=peers.find(pe=>pe.presence&&pe.presence.r==='h'&&pe.presence.st);
    if(!h){setStatus('Esperando al anfitrión…');return}
    const V=h.presence.st;
    if(hostPeerState&&hostPeerState.g===V.g&&hostPeerState.v===V.v)return;
    hostPeerState=V;
    const mine=V.ph==='lobby'?null:V.pl.findIndex(a=>a[9]===hash(MYTOK));
    MYSEAT=mine!=null&&mine>=0?mine:null;
    pendingAct=false;
    onView(decode(JSON.parse(JSON.stringify(V))));
  }
}
let pendingAct=false;
function send(a){
  if(MODE==='guest'){if(!GROOM||pendingAct)return;pendingAct=true;a.id=rid();GROOM.presence({a}).catch(()=>{pendingAct=false});setTimeout(()=>{if(pendingAct){pendingAct=false;render()}},4000);render();return}
  const seat=a.seat!=null?a.seat:(MODE==='host'?MYSEAT:actorSeat(a));
  delete a.seat;
  if(act(seat,a))commit();
}
function actorSeat(a){
  if(a.t==='oyes'||a.t==='ono')return S.offer?S.offer.to:null;
  if(a.t==='ocancel')return S.offer?S.offer.f:null;
  if(a.t==='ans')return S.q?S.q.p:null;
  return S.turn;
}

/* =================== VISTA Y ANIMACIÓN =================== */
let V=null;          // vista actual decodificada
let disp=[];         // posición mostrada de cada ficha
let lastEv=0,lastG=null;
let Q=[],playing=false,animEnd=0;
const busy=()=>playing||Q.length>0;
let shownCard=null,quizSeen=null;

function onView(nv){
  const newGame=!V||nv.g!==lastG;
  V=nv;
  if(V.ph==='lobby'){lastG=V.g;render();return}
  if(newGame){lastG=V.g;lastEv=V.ev.length?V.ev[V.ev.length-1].id:0;disp=V.P.map(p=>p.pos);render();return}
  const fresh=V.ev.filter(e=>e.id>lastEv);
  if(fresh.length){lastEv=fresh[fresh.length-1].id;Q.push(...fresh)}
  render();
  if(!playing)playQ();
}
async function playQ(){
  playing=true;
  while(Q.length){const e=Q.shift();try{await playEv(e)}catch(err){}}
  playing=false;
  if(V&&V.P)disp=V.P.map(p=>p.pos);
  render();
  if(MODE==='local'||MODE==='host')cpuTick();
}
const wait=ms=>new Promise(r=>setTimeout(r,T(ms)));
async function playEv(e){
  switch(e.k){
    case 'dc':await rollDice(e.a,e.b);break;
    case 'mv':{const st=e.n>0?1:-1;let pos=e.f;for(let s=0;s!==e.n;s+=st){pos=(pos+st+40)%40;disp[e.p]=pos;renderTokens(e.p);await wait(170)}await wait(120);break}
    case 'jp':disp[e.p]=e.to;renderTokens(e.p);await wait(400);break;
    case '$':floatMoney(e.p,e.d);break;
    case 'cd':await showCard(e.d,e.i);break;
    case 'bn':await banner(e.s,e.h,e.x);break;
    case 'ac':{const a=ACH.find(x=>x.id===e.a);await banner('gold','Logro: '+a.h,(V.P[e.p]?V.P[e.p].n:'')+' cobra '+a.n+' siclos');break}
    case 'by':stampTile(e.i);await wait(500);break;
    case 'bd':stampTile(e.i);break;
    case 'rz':{const t=$('#t'+e.i);if(t){t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake')}break}
    case 'qa':break;
  }
}
async function rollDice(a,b){
  const ds=[...document.querySelectorAll('#center .die')];
  if(!ds.length||FAST)return;
  ds.forEach(d=>d.classList.add('tumble'));
  for(let k=0;k<7;k++){ds[0].innerHTML=pips(d6());ds[1].innerHTML=pips(d6());await wait(80)}
  ds.forEach(d=>d.classList.remove('tumble'));
  ds[0].innerHTML=pips(a);ds[1].innerHTML=pips(b);
  await wait(250);
}
function floatMoney(pi,d){
  const row=document.querySelector('#players .pl[data-p="'+pi+'"]');if(!row||FAST)return;
  const r=row.getBoundingClientRect();const f=document.createElement('span');f.className='float '+(d>0?'plus':'minus');f.textContent=(d>0?'+':'−')+Math.abs(d);
  f.style.position='fixed';f.style.left=(r.right-90)+'px';f.style.top=(r.top+4)+'px';f.style.right='auto';document.body.appendChild(f);setTimeout(()=>f.remove(),1500);
}
function stampTile(i){const t=$('#t'+i);if(!t||FAST)return;t.classList.remove('stamp');void t.offsetWidth;t.classList.add('stamp');setTimeout(()=>t.classList.remove('stamp'),1000)}
function particles(n){let h='';for(let k=0;k<n;k++)h+=`<i class="p" style="left:${Math.random()*100}%;animation-delay:${(Math.random()*1.2).toFixed(2)}s;--dx:${(Math.random()*80-40).toFixed(0)}px"></i>`;return h}
function banner(s,h,x){
  if(FAST)return Promise.resolve();
  const bx=$('#bannerbox');
  bx.innerHTML=`<div class="banner ${s}"><div class="box">${particles(s==='dark'?0:26)}<b>${esc(h)}</b><span>${esc(x||'')}</span></div></div>`;
  if(s==='fire'){const b=$('#board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
  return new Promise(r=>setTimeout(()=>{bx.innerHTML='';r()},2800));
}
function cardData(d,i){return d==='par'?PARABOLAS[i]:d==='sab'?SABIDURIA[i]:ACN[i]}
const DECKN={par:'Parábola',sab:'Sabiduría',acn:'Acontecimiento'};
const DECKI={par:'✎',sab:'✦',acn:'⚔'};
function showCard(d,i){
  if(FAST)return Promise.resolve();
  const c=cardData(d,i);
  return new Promise(res=>{
    const close=()=>{$('#modal').innerHTML='';res();render()};
    $('#modal').innerHTML=`<div class="modal-bg" id="cardbg"><div class="flip"><div class="inner">
      <div class="back"><span>${DECKI[d]}</span></div>
      <div class="front"><div class="scroll"><div class="seal">${DECKI[d]}</div><div class="kind">${DECKN[d]}</div><h2>${esc(c.h)}</h2><p>${esc(c.x)}</p><div class="ref">${esc(c.r)}</div>
      <div class="acts"><button class="btn" id="cardok">Continuar</button></div></div></div></div></div></div>`;
    $('#cardok').onclick=close;$('#cardbg').onclick=e=>{if(e.target.id==='cardbg')close()};
    if(d==='acn'&&c.s==='fire'){const b=$('#board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
    setTimeout(()=>{if($('#cardok'))close()},6000);
  });
}

/* ----- permisos de interfaz ----- */
function canAct(seat){
  if(seat==null||!V||!V.P||!V.P[seat])return false;
  if(MODE==='local')return !V.P[seat].cpu;
  if(MODE==='guest')return seat===MYSEAT&&!pendingAct;
  if(MODE==='host')return seat===MYSEAT;
  return false;
}

/* =================== RENDER =================== */
function pips(n){const pos={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]}[n]||[5];let h='';for(let k=1;k<=9;k++){const r=Math.ceil(k/3),c=(k-1)%3+1;if(pos.includes(k))h+=`<i style="grid-area:${r}/${c}"></i>`}return h}
function buildBoard(){
  const b=$('#board');let h='';
  SP.forEach((s,i)=>{
    const [r,c]=cell(i),side=SIDE(i);
    if(side==='c'){h+=`<button class="tile corner" id="t${i}" style="grid-row:${r};grid-column:${c}" data-i="${i}" aria-label="${s.n}"><span class="ic">${s.ic}</span><span class="nm">${s.n}</span><span class="toks"></span></button>`;return}
    const band=s.t==='prop'?`background:${GR[s.g].c}`:'background:transparent';

    h+=`<button class="tile s-${side}" id="t${i}" style="grid-row:${r};grid-column:${c}" data-i="${i}" aria-label="${s.n}"><span class="band" style="${band}"></span><span class="txt">${inner}</span><span class="own"></span><span class="toks"></span></button>`;
  });
  h+=`<div class="center" id="center"></div><div class="rolls" aria-hidden="true"></div>`;
  b.innerHTML=h;
  b.addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)openDeed(+t.dataset.i)});
}
function renderTokens(hopP){
  if(!V||!V.P)return;
  SP.forEach((s,i)=>{$('#t'+i).querySelector('.toks').innerHTML='';$('#t'+i).classList.remove('here')});
  V.P.forEach((p,k)=>{if(p.out)return;const pos=disp[k]!=null?disp[k]:p.pos;const t=$('#t'+pos);
    t.querySelector('.toks').insertAdjacentHTML('beforeend',`<span class="tok${k===hopP?' hop':''}" style="background:${PCOL[p.c]}" title="${esc(p.n)}">${esc((p.n||'?')[0].toUpperCase())}</span>`);
    if(k===V.t&&!busy())t.classList.add('here')});

  $('#log').innerHTML=V.log.map(l=>`<li>${esc(l)}</li>`).join('');
  renderOverlays();
}
function renderOverlays(){
  if(busy()&&$('#cardbg'))return; // una carta en pantalla
  const m=$('#modal');
  if(m.querySelector('#deedbg'))return;
  // pregunta
  if(V.q&&(V.ph==='quiz'||V.q.a>=0)&&quizSeen!==V.q.id+':'+V.q.a){
    if(busy())return;
    const q=QS[V.q.i],who=V.P[V.q.p],mine=canAct(V.q.p)&&V.q.a<0;
    const opts=V.q.o.map((oi,k)=>{let cls='';if(V.q.a>=0){if(oi===0)cls='ok';else if(k===V.q.a)cls='bad'}return `<button class="opt ${cls}" data-k="${k}" ${mine?'':'disabled'}>${esc(q.o[oi])}</button>`}).join('');

function deedBody(i){
  const s=SP[i];let rows='';
  if(s.t==='prop'){const b=BASE[s.p];rows=`<tr><td>Renta</td><td>${b}</td></tr><tr><td>Con todo el grupo</td><td>${b*2}</td></tr>`+[1,2,3,4].map(h=>`<tr><td>Con ${h} casa${h>1?'s':''}</td><td>${b*MULT[h]}</td></tr>`).join('')+`<tr><td>Con muralla</td><td>${b*MULT[5]}</td></tr><tr><td>Cada construcción</td><td>${GR[s.g].h}</td></tr>`}
  else if(s.t==='route')rows=`<tr><td>1 ruta</td><td>25</td></tr><tr><td>2 rutas</td><td>50</td></tr><tr><td>3 rutas</td><td>100</td></tr><tr><td>4 rutas</td><td>200</td></tr>`;
  else if(s.t==='well')rows=`<tr><td>1 fuente</td><td>4 × dados</td></tr><tr><td>Las 2 fuentes</td><td>10 × dados</td></tr>`;
  if(buyable(i))rows=`<tr><td>Precio</td><td>${s.p}</td></tr>`+rows+`<tr><td>Empeño</td><td>${s.p/2}</td></tr><tr><td>Venta al banco</td><td>${Math.floor(s.p*.7)}</td></tr>`;
  const info=s.f?`<div class="fact">${s.f}<em>${s.r}</em></div>`:
    s.t==='par'?'<div class="fact">Saca una carta de Parábola.</div>':s.t==='sab'?'<div class="fact">Saca una carta de Sabiduría.</div>':s.t==='acn'?'<div class="fact">Saca una carta de Acontecimiento: sucesos de la historia bíblica que afectan a todos.</div>':
    s.t==='refuge'?'<div class="fact">Protegía a quien había matado sin intención. Se sale con dobles, con la carta del sumo sacerdote o al tercer turno. No se acepta rescate.<em>Nú 35:25, 32; Jos 20:4-6</em></div>':
    s.t==='avenger'?'<div class="fact">El vengador de la sangre te persigue: ve directo a la ciudad de refugio sin cobrar en Día de pago.<em>Nú 35:11, 12</em></div>':
    s.t==='rest'?'<div class="fact">Día de descanso. Quien cae aquí responde una pregunta bíblica: si acierta, cobra 100.<em>Éx 20:8-10</em></div>':
    s.t==='go'?'<div class="fact">Al pasar cobras 200 siclos de jornal. Si caes justo aquí, respondes una pregunta extra.<em>Mt 20:2</em></div>':'';
  return {rows,info};
}
function openDeed(i){
  const s=SP[i],col=s.t==='prop'?GR[s.g].c:'#5a3719';const {rows,info}=deedBody(i);
  let own='',acts='';
  if(V&&V.PR&&buyable(i)){
    const pr=V.PR[i];own=pr.o!=null?`<p><b>Dueño:</b> ${esc(V.P[pr.o].n)}${pr.m?' · empeñada':''}${pr.h?(pr.h===5?' · muralla':' · '+pr.h+' casa(s)'):''}</p>`:'<p>Sin dueño.</p>';
    const ok=pr.o!=null&&pr.o===V.t&&canAct(pr.o)&&(V.ph==='roll'||V.ph==='end')&&!busy()&&!V.of;
    if(ok){
      const P2=V.P[pr.o],clear=s.t!=='prop'||groupIdx(s.g).every(k=>V.PR[k].h===0);
      const full=s.t==='prop'&&groupIdx(s.g).every(k=>V.PR[k].o===pr.o)&&!groupIdx(s.g).some(k=>V.PR[k].m);
      if(s.t==='prop'&&full&&pr.h<5)acts+=`<button class="btn green" data-a="build" ${P2.cash>=GR[s.g].h?'':'disabled'}>${pr.h===4?'Levantar muralla':'Construir casa'} (${GR[s.g].h})</button>`;
      if(pr.h)acts+=`<button class="btn alt" data-a="sellh">Vender construcción (+${GR[s.g].h/2})</button>`;
      if(!pr.m&&clear)acts+=`<button class="btn alt" data-a="mort">Empeñar (+${s.p/2})</button>`;
      if(pr.m)acts+=`<button class="btn" data-a="unmort" ${P2.cash>=s.p/2?'':'disabled'}>Recuperar (${s.p/2})</button>`;
      if(!pr.m&&clear){acts+=`<button class="btn red" data-a="bank">Vender al banco (+${Math.floor(s.p*.7)})</button>`;
        const others=V.P.map((x,k)=>({x,k})).filter(o=>o.k!==pr.o&&!o.x.out);
        if(others.length)acts+=`<div class="field" style="width:100%"><label for="offto">Vender a</label><select id="offto">${others.map(o=>`<option value="${o.k}">${esc(o.x.n)}</option>`).join('')}</select><label for="offpr">por</label><input id="offpr" type="number" min="1" max="5000" value="${s.p}"><button class="btn" data-a="offer">Ofrecer</button></div>`}
      if(!acts)acts='<span class="small">Completa el grupo para construir.</span>';
    }
  }
  $('#modal').innerHTML=`<div class="modal-bg" id="deedbg"><div class="scroll"><div class="deedhd" style="background:${col}"><small>${s.t==='prop'?'Título · '+GR[s.g].n:s.t==='route'?'Ruta comercial':s.t==='well'?'Fuente de agua':'Casilla'}</small><b>${s.n}</b></div>
    ${rows?`<table class="deedtab">${rows}</table>`:''}${info}${own}<div class="acts">${acts}<button class="btn alt" data-a="close">Cerrar</button></div></div></div>`;
  const bg=$('#deedbg');
  bg.onclick=e=>{if(e.target===bg){$('#modal').innerHTML='';render();return}const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
    if(a==='close'){$('#modal').innerHTML='';render();return}
    const msg={t:a,i};if(a==='offer'){msg.to=+$('#offto').value;msg.pr=+$('#offpr').value}
    $('#modal').innerHTML='';send(msg);};
}

  <li><b>Vender a otro jugador:</b> eliges a quién y el precio. El otro acepta o rechaza. Primero hay que vender las construcciones del grupo.</li></ul>
  <h3>Acontecimientos</h3>
  <p>Además de las casillas, cada 4 rondas ocurre un acontecimiento histórico que afecta a todos: la invasión de Babilonia, la caída de Samaria, Jeremías en la cisterna, los años de abundancia y de hambre, el decreto de Ciro, Pentecostés y otros. Algunos derriban construcciones y otros reparten o cobran siclos.</p>
  <h3>Logros</h3>
  <p>Hay 9 logros con recompensa en siclos, como Heredero de Abrahán, Sabio como Salomón o Mercader de Tiro. Se ven en la pestaña «Cartas y títulos» y como insignias junto a cada jugador.</p>
  <h3>Leyes especiales</h3>
  <div class="note">
   <p><b>Ciudad de refugio (en lugar de la cárcel).</b> Las seis ciudades de refugio protegían a quien había matado sin intención. El refugiado se quedaba allí hasta la muerte del sumo sacerdote, y no se aceptaba rescate. En el juego no se paga para salir: sales con dobles, con la carta del sumo sacerdote o al tercer turno. Mientras tanto sigues cobrando tus rentas.</p>
   <p><b>Año sabático.</b> Cada séptimo año la tierra descansaba. En las rondas 7, 14, 21, 28, 35, 42 y 49 nadie cobra renta.</p>
   <p><b>Año de Jubileo.</b> En el año 50 se tocaba el cuerno de carnero y se proclamaba libertad: la tierra vendida volvía a su familia. En el juego, en las rondas 25 y 50 se cancelan todos los empeños y los refugiados quedan libres.</p>
   <p><b>Rebusca.</b> La Ley dejaba las espigas para el pobre, la viuda y el forastero, como hizo Booz con Rut. Si tienes menos de 200 siclos al pagar renta, pagas la mitad.</p>
  </div>
  <h3>Bancarrota y fin del juego</h3>
  <p>Si no alcanzas a pagar, se venden tus construcciones y se empeñan tus tierras. Si aún no alcanza, quedas en bancarrota y tus tierras vuelven al banco. Gana quien tenga mayor patrimonio al terminar las rondas, o el último que quede en pie.</p>
  <h3>Fuentes</h3>
  <p>Toda la información del juego se tomó de jw.org:</p>
